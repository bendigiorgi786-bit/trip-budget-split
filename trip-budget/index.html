<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trip Budget & Split</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✈️</text></svg>">
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- In-Browser SASS Compiler CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sass.js/0.11.1/sass.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Compiles src/style.scss dynamically -->
  <script>
    fetch('./src/style.scss')
      .then(res => res.text())
      .then(scssText => {
        Sass.compile(scssText, result => {
          if (result.status === 0) {
            const style = document.createElement('style');
            style.innerHTML = result.text;
            document.head.appendChild(style);
          } else {
            console.error('SASS Compilation Error:', result.formatted);
          }
        });
      })
      .catch(err => console.error('SCSS Fetch Error:', err));
  </script>
</head>
<body class="bg-slate-50 text-slate-800 font-['Inter',sans-serif] min-h-screen py-10 px-4 sm:px-6">

  <!-- Header -->
  <header class="max-w-4xl mx-auto mb-8 text-center sm:text-left flex flex-col sm:flex-row justify-between items-center gap-4">
    <div>
      <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Trip Budget & Split</h1>
      <p class="text-sm text-slate-500 mt-0.5">Track expenses and calculate bill splits instantly.</p>
    </div>
    <div class="flex items-center gap-2 bg-white px-3 py-1.5 rounded-lg border border-slate-200 text-xs font-medium text-slate-600">
      <span>Status:</span>
      <span class="text-emerald-600 font-semibold">Active Trip</span>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-12 gap-6">

    <!-- Form Section -->
    <section class="md:col-span-7 bg-white rounded-2xl p-6 border border-slate-200/80 card-shadow">
      <h2 class="text-base font-semibold text-slate-900 mb-5">Add Expense</h2>

      <form id="expenseForm" class="space-y-4">
        <div>
          <label for="desc" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5">Expense Name</label>
          <input 
            type="text" 
            id="desc" 
            placeholder="e.g., Dinner, Train Ticket, Coffee" 
            class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3.5 py-2.5 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition"
            required
          />
        </div>

        <div class="grid grid-cols-3 gap-3">
          <div class="col-span-2">
            <label for="amount" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5">Amount</label>
            <input 
              type="number" 
              id="amount" 
              step="0.01" 
              placeholder="0.00" 
              class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3.5 py-2.5 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition"
              required
            />
          </div>
          <div>
            <label for="currency" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5">Currency</label>
            <select id="currency" class="custom-select w-full bg-slate-50 border border-slate-200 rounded-lg px-3.5 py-2.5 text-sm font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition">
              <option value="EUR">EUR (€)</option>
              <option value="USD">USD ($)</option>
              <option value="PLN">PLN (zł)</option>
              <option value="GEL">GEL (₾)</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label for="category" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5">Category</label>
            <select id="category" class="custom-select w-full bg-slate-50 border border-slate-200 rounded-lg px-3.5 py-2.5 text-sm font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition">
              <option value="Food">🍽️ Food</option>
              <option value="Transport">🚆 Transport</option>
              <option value="Stay">🏨 Lodging</option>
              <option value="Activities">🎟️ Activities</option>
            </select>
          </div>
          <div>
            <label for="split" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5">People Count</label>
            <input 
              type="number" 
              id="split" 
              value="2" 
              min="1" 
              class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3.5 py-2.5 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition"
            />
          </div>
        </div>

        <button 
          type="submit" 
          class="w-full mt-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm py-2.5 rounded-lg shadow-sm hover:shadow transition"
        >
          Add Expense
        </button>
      </form>
    </section>

    <!-- Results Section -->
    <section class="md:col-span-5 flex flex-col gap-4">
      <div class="bg-indigo-900 text-white rounded-2xl p-6 shadow-md relative overflow-hidden">
        <span class="text-xs font-medium uppercase tracking-wider text-indigo-300">Total Spent</span>
        <div class="text-3xl font-bold mt-1 mb-4" id="totalDisplay">€0.00</div>

        <div class="pt-3 border-t border-indigo-800/80 flex justify-between items-center text-xs text-indigo-200">
          <span>Cost Per Person:</span>
          <span class="font-semibold text-sm text-white" id="perPersonDisplay">€0.00</span>
        </div>
      </div>

      <div class="bg-white rounded-2xl p-5 border border-slate-200/80 card-shadow flex-1 flex flex-col">
        <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-3">Expense Log</h3>
        
        <ul id="expenseList" class="divide-y divide-slate-100 text-sm overflow-y-auto max-h-60 space-y-1">
          <li id="emptyState" class="py-8 text-center text-slate-400 text-xs">
            No expenses logged yet.
          </li>
        </ul>
      </div>
    </section>

  </main>

  <!-- Form Logic Script -->
 <script>
  const form = document.getElementById('expenseForm');
  const expenseList = document.getElementById('expenseList');
  const emptyState = document.getElementById('emptyState');
  const totalDisplay = document.getElementById('totalDisplay');
  const perPersonDisplay = document.getElementById('perPersonDisplay');

  // Array to hold all expense objects
  let expenses = [];

  // Recalculate totals across all items
  function updateTotals() {
    const totalAmount = expenses.reduce((sum, item) => sum + item.amount, 0);
    const totalSplit = parseInt(document.getElementById('split').value) || 1;

    totalDisplay.textContent = `€${totalAmount.toFixed(2)}`;
    perPersonDisplay.textContent = `€${(totalAmount / totalSplit).toFixed(2)}`;
  }

  // Delete an item by its unique ID
  function deleteExpense(id) {
    expenses = expenses.filter(item => item.id !== id);
    renderList();
    updateTotals();
  }

  // Render list items to the DOM
  function renderList() {
    expenseList.innerHTML = '';

    if (expenses.length === 0) {
      expenseList.appendChild(emptyState);
      return;
    }

    expenses.forEach(item => {
      const li = document.createElement('li');
      li.className = "py-3 flex justify-between items-center gap-2 border-b border-slate-100 last:border-none";
      li.innerHTML = `
        <div class="flex flex-col">
          <span class="font-medium text-slate-800">${item.desc}</span>
          <span class="text-xs text-slate-400">${item.category} • Split by ${item.split}</span>
        </div>
        <div class="flex items-center gap-3">
          <span class="font-semibold text-slate-700">${item.currency} ${item.amount.toFixed(2)}</span>
          <button 
            type="button" 
            onclick="deleteExpense(${item.id})"
            class="text-slate-400 hover:text-red-500 text-xs font-semibold px-1.5 py-0.5 rounded hover:bg-red-50 transition"
            title="Delete Expense"
          >
            ✕
          </button>
        </div>
      `;
      expenseList.appendChild(li);
    });
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();

    const desc = document.getElementById('desc').value;
    const amount = parseFloat(document.getElementById('amount').value);
    const currency = document.getElementById('currency').value;
    const category = document.getElementById('category').value;
    const split = parseInt(document.getElementById('split').value) || 1;

    // Create unique expense object
    const newExpense = {
      id: Date.now(),
      desc,
      amount,
      currency,
      category,
      split
    };

    expenses.unshift(newExpense);
    renderList();
    updateTotals();

    // Clear form inputs
    document.getElementById('desc').value = '';
    document.getElementById('amount').value = '';
  });
</script>
</body>
</html>
